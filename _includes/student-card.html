<article class="thesis-card">
  <div class="thesis-card-meta">
    <span class="thesis-card-status" data-status="progress">
      {% include icon.html icon="fa-solid fa-hourglass-half" %}In progress
    </span>
  </div>
  {% if include.name %}<h3 class="thesis-card-title">{{ include.name }}</h3>{% endif %}
  {% if include.topic %}
    <p class="thesis-card-topic">{{ include.topic }}</p>
  {% else %}
    <p class="thesis-card-topic thesis-card-muted">Topic forthcoming</p>
  {% endif %}
  {% if include.advisor %}<p class="thesis-card-advisor">Chair: {{ include.advisor }}</p>{% endif %}
</article>
