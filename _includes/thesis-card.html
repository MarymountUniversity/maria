<article class="thesis-card">
  <div class="thesis-card-meta">
    {% if include.date %}<span class="thesis-card-date">{{ include.date }}</span>{% endif %}
    <span class="thesis-card-status" data-status="complete">
      {% include icon.html icon="fa-solid fa-circle-check" %}Completed
    </span>
  </div>
  {% if include.title %}<h3 class="thesis-card-title">{{ include.title }}</h3>{% endif %}
  {% if include.author %}<p class="thesis-card-person">{{ include.author }}</p>{% endif %}
  {% if include.advisor %}<p class="thesis-card-advisor">Chair: {{ include.advisor }}</p>{% endif %}
</article>
